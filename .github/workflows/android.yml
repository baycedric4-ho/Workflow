name: "Android"

on:
  workflow_call:
    inputs:
      build-id:
        description: 'Identifier for workflows and caching'
        type: string
        required: true
      cpm-cache-version:
        description: "CPM Cache Version"
        type: string
        required: true
      devel:
        description: 'Development mode (disables update checker)'
        type: string
        required: true
      force_pgo:
        description: "Force PGO builds"
        type: string
        required: true

env:
  ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
  SCCACHE_GHA_ENABLED: "true"
  CCACHE: "true"
  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
  DEVEL: ${{ inputs.devel }}
  BUILD_ID: ${{ inputs.build-id }}
  FORCE_PGO: ${{ inputs.force_pgo }}

jobs:
  and-matrix:
    name: "Generate Android Matrix"
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Make CI scripts executable
        run: chmod -R +x ./.ci

      - id: set
        run: echo "matrix=$(./.ci/matrix/android.sh)" >> "$GITHUB_OUTPUT"

  android:
    name: "Android"
    needs: [and-matrix]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.and-matrix.outputs.matrix) }}
    env:
      FLAVOR: "${{ matrix.flavor }}"
      PGO_TARGET: "${{ matrix.target }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/workflows/setup
        with:
          key: ${{ runner.os }}-amd64-universal
          version: ${{ inputs.cpm-cache-version }}

      - name: Install dependencies
        run: ./.ci/deps/android.sh

      - name: Build
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/build/android.sh -DCCACHE_PATH=${SCCACHE_PATH}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.flavor }}-${{ matrix.target }}
          archive: false
          path: artifacts/*.apk

      - name: Capture & Display logs on failure
        if: failure()
        run: ./.ci/debug/dump-logs.sh artifacts/build-logs-${{ matrix.flavor }}

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: error-logs-android-${{ matrix.flavor }}-${{ matrix.target }}
          path: artifacts/build-logs-${{ matrix.flavor }}
          if-no-files-found: ignore
          archive: true

  android-x86_64:
    name: "Android x86_64 (Chromebook)"
    runs-on: ubuntu-latest
    env:
      FLAVOR: "chromeos"
      PGO_TARGET: "standard"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Make CI scripts executable
        run: chmod -R +x ./.ci

      - name: Setup
        uses: ./.github/workflows/setup
        with:
          key: ${{ runner.os }}-amd64-universal
          version: ${{ inputs.cpm-cache-version }}

      - name: Install dependencies
        run: ./.ci/deps/android.sh

      - name: Build
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/build/android.sh -DCCACHE_PATH=${SCCACHE_PATH}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-x86_64-chromeos
          archive: false
          path: artifacts/*.apk

      - name: Capture & Display logs on failure
        if: failure()
        run: ./.ci/debug/dump-logs.sh artifacts/build-logs-x86_64

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: error-logs-android-x86_64
          path: artifacts/build-logs-x86_64
          if-no-files-found: ignore
          archive: true

